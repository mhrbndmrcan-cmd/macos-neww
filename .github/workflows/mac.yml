name: macOS Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-15

    steps:
      - name: Ekran Paylasimini ve Monitöru Ac
        run: |
          # Otomatik giris yap ve ekran uyutmayi kapat
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"
          sudo pmset -a disablesleep 1
          
          # VNC yetkilerini ver
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNC-Only -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCOnly -bool true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw 123456

      - name: Tunel Kur ve Baglantiyi Ver
        run: |
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-apple-darwin.tar.gz | tar -xz
          ./bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 4
          echo "=========================================="
          echo "YENI BAGLANTI ADRESI:"
          cat bore.log
          echo "=========================================="

      - name: Sunucuyu Acik Tut
        run: |
          sleep 21600
