name: macOS Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-15

    steps:
      - name: Runner Kullanicisini ve VNC'yi Tam Yetkili Yap
        run: |
          # 1. Eski sifreyi sormadan doğrudan '123456' sifresini ata
          sudo sysadminctl -resetPasswordFor runner -newPassword "123456"
          
          # 2. Otomatik oturum acmayi aktif et
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"

          # 3. Remote Management'i 'runner' kullanicisi icin tam yetkiyle baslat
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all \
            -clientopts -setvnclegacy yes -setvncpw -vncpw 123456 \
            -restart -agent

      - name: Tunel Kur ve Baglantiyi Ver
        run: |
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-apple-darwin.tar.gz | tar -xz
          ./bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 4
          echo "=========================================="
          echo "YENI ADRES:"
          cat bore.log
          echo "=========================================="

      - name: Sunucuyu Acik Tut
        run: |
          sleep 21600
